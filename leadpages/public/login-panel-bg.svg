<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" fill="none" preserveAspectRatio="xMidYMid slice">
  <g fill="#ffffff">
    <!-- top-right layered-square motif (echoes the Leadpages logo mark) -->
    <g opacity="0.16" transform="translate(444 -58) rotate(9)">
      <rect x="0" y="0" width="196" height="196" rx="54"/>
      <rect x="76" y="76" width="146" height="146" rx="40" opacity="0.55"/>
    </g>
    <!-- bottom-left motif, larger, bleeding off the edge -->
    <g opacity="0.13" transform="translate(-84 500) rotate(-7)">
      <rect x="0" y="0" width="240" height="240" rx="64"/>
      <rect x="88" y="88" width="176" height="176" rx="48" opacity="0.5"/>
    </g>
    <!-- accent, lower-right -->
    <g opacity="0.12" transform="translate(470 512) rotate(4)">
      <rect x="0" y="0" width="132" height="132" rx="36"/>
      <rect x="50" y="50" width="100" height="100" rx="28" opacity="0.55"/>
    </g>
  </g>
</svg>
